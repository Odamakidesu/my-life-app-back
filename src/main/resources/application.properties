spring.application.name=mylifeapp
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.web.resources.static-locations=classpath:/static/
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SQL/DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# SQL
logging.level.org.springframework.jdbc=DEBUG

# JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

spring.security.user.name=aaa
spring.security.user.password=aaa

# JWT
# jwt.secret はリポジトリに置かない。未設定なら起動時に失敗させ、設定漏れを検知する。
#   ローカル: application-local.properties (gitignore対象) に記述
#   本番    : ECSタスク定義の secrets から JWT_SECRET として注入
jwt.expiration-ms=86400000

# default location
spring.profiles.active=local