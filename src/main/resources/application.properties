spring.application.name=mylifeapp
server.port=8080

# ============================================================================
# このファイルは「本番として安全な既定値」を持つ。
# 開発用に緩める設定は application-local.properties 側で上書きすること。
# 以前は逆向き（基底に開発用の値を置き、本番で打ち消す）だったため、
# ECS タスク定義の環境変数が唯一の防御線になっていた。
# ============================================================================

# --- 静的リソース / ビュー ---
spring.web.resources.static-locations=classpath:/static/
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,prometheus
# 詳細（DB 製品名・バージョン、ディスク容量）は任意の認証済みユーザーに見せない。
# 誰でも register できるため、認証済みであることは何の制限にもならない。
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
# readiness に DB を含める。ALB のターゲットグループはここに向けること。
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# --- SQL 初期化 ---
# 既定は never。schema.sql の先頭は DROP TABLE であり、これが本番で走るとデータが全消失する。
# local プロファイルだけが always に上書きする。
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- JDBC / コネクションプール ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# プールからの取得待ち。取得済み接続でのクエリ実行時間はこれでは縛れない点に注意
# （そちらは JDBC URL の socketTimeout と query-timeout で縛る）。
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
# RDS の wait_timeout より短くして、切断済み接続を掴まないようにする。
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
# JdbcTemplate 経由の文が無限に待つのを防ぐ（秒）。
spring.jdbc.template.query-timeout=10

# --- Tomcat ---
# 0.5 vCPU / DB アクセス主体のワークロードに対して 200 スレッドは過剰で、
# コンテキストスイッチとスレッドスタック（200MB相当）を無駄に消費する。
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
# ALB 配下でクライアントのスキーマ / IP を正しく解決するために必要。
server.forward-headers-strategy=framework

# --- ログ ---
# SQL のバインド値（ノート本文・ユーザー名・BCryptハッシュ）を本番ログに出さない。
# デバッグ用のログレベルは application-local.properties にのみ置くこと。
logging.level.org.springframework.jdbc=WARN

# --- JWT ---
# jwt.secret はリポジトリに置かない。未設定なら起動時に失敗させ、設定漏れを検知する。
#   ローカル: application-local.properties (gitignore対象) に記述
#   本番    : ECSタスク定義の secrets から JWT_SECRET として注入
# キー名は JwtProperties (@ConfigurationProperties(prefix="jwt")) にバインドされる。
# 名前がずれた場合は起動時のバインド失敗として露見する。
jwt.expiration-ms=86400000

# --- レート制限 ---
app.rate-limit.enabled=true
app.rate-limit.login-capacity=10
app.rate-limit.login-period=1m
app.rate-limit.register-capacity=5
app.rate-limit.register-period=1h
app.rate-limit.max-tracked-clients=50000

# --- HTTPS ---
# フロントエンドが S3 ウェブサイトエンドポイント（HTTPS 非対応）で配信されている間は
# 有効化できない。CloudFront + ACM への移行後に true にすること。
app.security.require-https=false

# default location
spring.profiles.active=local
