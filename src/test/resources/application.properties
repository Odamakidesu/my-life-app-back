spring.application.name=mylifeapp

# The datasource is supplied by Testcontainers (see AbstractIntegrationTest).
# The previous configuration pointed at a real MySQL on localhost:3306 with root/root
# and ran schema.sql, whose first statement is DROP TABLE. Running the test suite
# therefore wiped the developer's local database, and CI had no MySQL at all.
# The schema is built by Flyway from db/migration, exactly as in production,
# plus the development seed in db/seed (tests rely on the seeded users and tags).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Test-only value. Unrelated to any real environment.
jwt.secret=test-only-dummy-secret-do-not-use-in-any-real-environment-0123456789
jwt.expiration-ms=86400000

# SecurityConfig requires this for the CORS allow-list.
app.api.endpoint.base-url=http://localhost:5173

# Disabled so repeated logins inside a test class are not throttled.
# RateLimitFilter itself is covered by its own test.
app.rate-limit.enabled=false

logging.level.org.springframework.jdbc=WARN

# Same as main: keep Jackson 3 on Spring Boot 3's (Jackson 2) defaults so the
# JSON contract the contract tests assert on is the one production actually serves.
spring.jackson.use-jackson2-defaults=true
