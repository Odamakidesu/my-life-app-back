name: Deploy Backend to ECS

# アクションはすべてコミット SHA でピン止めする。可変タグ (@v1, @v4) のままだと、
# 上流リポジトリやメンテナのアカウントが侵害されてタグを差し替えられた場合に、
# 次回の push で悪意あるコードが AWS 資格情報を持つジョブの中で実行される。
# 更新時は `git ls-remote --tags https://github.com/<repo> 'refs/tags/<tag>^{}'` で取り直すこと。

on:
  push:
    branches:
      - main
  # PR 時にテストを走らせる。以前は push(main) だけで、しかも test を一度も実行していなかった。
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # check には test と jacocoTestCoverageVerification が含まれる。
      # DB は Testcontainers が起動するので、ランナー側の MySQL 準備は不要。
      - name: Run tests and coverage gate
        run: ./gradlew check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

  deploy:
    name: Build and Deploy to ECS
    # テストが落ちたらデプロイしない。
    # なお `needs:` だけでは PR のマージ自体は止まらないので、GitHub の branch protection で
    # test を Required status check に指定すること。
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dockerfile はマルチステージで、イメージの中でソースから jar を作る。
      # ここで別途 bootJar しても使われないので実行しない。
      # イメージの中身がリポジトリの内容だけで決まる（手元のビルド成果物に依存しない）。

      # TODO(セキュリティ): 静的な長命アクセスキーをやめ、GitHub OIDC のロール引受に移行すること。
      # このキーは ECR push と ECS デプロイの権限を持つため、漏れれば本番 RCE 相当になる。
      # 移行手順は docs/runbook-security-hardening.md を参照。移行後はここを次に置き換える:
      #   permissions:
      #     id-token: write
      #     contents: read
      #   - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      #     with:
      #       role-to-assume: arn:aws:iam::498504718094:role/github-actions-deploy
      #       aws-region: ${{ secrets.AWS_REGION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # イメージタグを コミット SHA にする。latest 固定だと、動いているイメージが
      # どのコミットのものか追跡できず、ロールバック先も特定できない。
      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" .
          docker tag "$REGISTRY/$ECR_REPO:$IMAGE_TAG" "$REGISTRY/$ECR_REPO:latest"
          docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPO:latest"
          echo "image=$REGISTRY/$ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ecs-task-def.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          wait-for-service-stability: true
